    <script>
      const tl = gsap.timeline({ paused: true });
      // grain shifts in steps on the timeline (no CSS loop), 12 positions per second
      const g = document.querySelector("#grain .grain-texture");
      const spots = [[0,0],[-5,-5],[-10,5],[5,-10],[-5,15],[-10,5],[15,0],[0,10],[-15,0],[10,5]];
      for (let i = 0; i < 78 * 12; i++) {
        const p = spots[i % spots.length];
        tl.set(g, { xPercent: p[0], yPercent: p[1] }, i / 12);
      }
      window.__timelines["main"] = tl;
    </script>
