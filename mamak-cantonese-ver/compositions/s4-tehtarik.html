  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // re-timed to the narration: old scene times map onto the voice
      const MAPK = [[0,0],[2.4,2.61],[3,3.326],[3.8,4.405],[4.3,4.917],[5.8,6.338],[6,6.538]];
      const T = (t) => { for (let i = 1; i < MAPK.length; i++) { const [a0, b0] = MAPK[i - 1], [a1, b1] = MAPK[i]; if (t <= a1) return b0 + ((t - a0) * (b1 - b0)) / (a1 - a0); } const [a, b] = MAPK[MAPK.length - 1]; return b + (t - a); };
      ["to", "fromTo", "set"].forEach((m) => { const f = tl[m].bind(tl); tl[m] = (...a) => { const i = a.length - 1; if (typeof a[i] === "number") a[i] = T(a[i]); return f(...a); }; });
      // the pull: mug and his raised arm rise together, stream lengthens and flows
      tl.fromTo("#s4-mug", { y: 300 }, { y: 0, duration: 2.2, ease: "power2.inOut" }, 0.1);
      tl.fromTo("#s4-armR", { attr: { y2: 680 } }, { attr: { y2: 380 }, duration: 2.2, ease: "power2.inOut" }, 0.1);
      tl.fromTo("#s4-st-top", { clipPath: "inset(300px 0px 0px 0px)" }, { clipPath: "inset(0px 0px 0px 0px)", duration: 2.2, ease: "power2.inOut" }, 0.1);
      tl.fromTo(".s4-stream", { backgroundPositionY: "0px" }, { backgroundPositionY: "1400px", duration: 2.4, ease: "none" }, 0);
      // the glass fills as he pours; the foam rides on the rising tea
      tl.fromTo("#s4-level", { attr: { y: 1340 } }, { attr: { y: 1196 }, duration: 2.3, ease: "power1.out" }, 0.1);
      tl.fromTo("#s4-foam", { y: 140, opacity: 0.6 }, { y: 0, opacity: 1, duration: 2.3, ease: "power1.out" }, 0.1);
      // the snap
      tl.fromTo("#s4-crack", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, transformOrigin: "540px 795px", duration: 0.06 }, 2.4);
      tl.to("#s4-crack", { opacity: 0, duration: 0.2 }, 2.6);
      tl.fromTo("#s4-st-top", { clipPath: "inset(0px 0px 0px 0px)" }, { clipPath: "inset(0px 0px 340px 0px)", duration: 0.25, ease: "power3.in", immediateRender: false }, 2.42);
      tl.fromTo("#s4-st-bot", { clipPath: "inset(0px 0px 0px 0px)" }, { clipPath: "inset(340px 0px 0px 0px)", duration: 0.4, ease: "power2.in" }, 2.42);
      tl.to("#s4-mug", { y: -40, duration: 0.3, ease: "power2.out" }, 2.42);
      tl.to("#s4-armR", { attr: { y2: 340 }, duration: 0.3, ease: "power2.out" }, 2.42);
      // colour drains out of the world
      tl.fromTo("#s4-drain", { opacity: 0 }, { opacity: 0.55, duration: 0.7, ease: "power2.inOut" }, 2.6);
      tl.to("#s4-teh", { fill: "#6f7477", duration: 0.7, ease: "power2.inOut" }, 2.6);
      tl.to("#s4-foam", { fill: "#9da3a5", duration: 0.7, ease: "power2.inOut" }, 2.6);

      // he and the mugs blow away like sand, left to right; the words stay
      let seed = 0x5a4d;
      const rnd = () => ((seed = (Math.imul(1664525, seed) + 1013904223) >>> 0) / 4294967296);
      const inPoly = (x, y, p) => { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { if ((p[i][1] > y) !== (p[j][1] > y) && x < ((p[j][0] - p[i][0]) * (y - p[i][1])) / (p[j][1] - p[i][1]) + p[i][0]) c = !c; } return c; };
      const segD = (x, y, a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1]; const t = Math.max(0, Math.min(1, ((x - a[0]) * dx + (y - a[1]) * dy) / (dx * dx + dy * dy))); return Math.hypot(x - a[0] - t * dx, y - a[1] - t * dy); };
      const SKIN = "#b98a63", WHITE = "#e6dccb", DARK = "#4a4f55", STEEL = "#b9bfbc", TEH = "#a99a85";
      const shapes = [
        [(x, y) => Math.hypot(x - 430, y - 590) < 62, SKIN],
        [(x, y) => x > 330 && x < 530 && y > 690 && y < 1170, WHITE],
        [(x, y) => x > 340 && x < 520 && y > 1170 && y < 1920, DARK],
        [(x, y) => segD(x, y, [352, 714], [388, 1238]) < 22, SKIN],
        [(x, y) => segD(x, y, [508, 714], [745, 340]) < 22, SKIN],
        [(x, y) => inPoly(x, y + 40, [[515, 440], [680, 470], [715, 250], [560, 215]]), STEEL],
        [(x, y) => inPoly(x, y, [[455, 1130], [625, 1130], [612, 1400], [468, 1400]]), TEH],
      ];
      const parts = [];
      for (let y = 160; y < 1920; y += 8) for (let x = 300; x < 800; x += 8) {
        for (const [hit, col] of shapes) {
          if (hit(x, y)) {
            parts.push({ x, y, col, at: T(2.75 + ((x - 300) / 500) * 0.9 + rnd() * 0.12), dur: 0.9 + rnd() * 0.6, dx: 140 + rnd() * 260, dy: -40 - rnd() * 200, s: 3 + rnd() * 3 });
            break;
          }
        }
      }
      const cv = document.getElementById("s4-sand");
      const cx = cv.getContext("2d");
      const paint = (t) => {
        cx.clearRect(0, 0, 1080, 1920);
        for (const p of parts) {
          const v = (t - p.at) / p.dur;
          if (v <= 0 || v >= 1) continue;
          const e = 1 - Math.pow(1 - v, 2);
          cx.globalAlpha = 1 - v;
          cx.fillStyle = p.col;
          cx.fillRect(p.x + p.dx * e, p.y + p.dy * e + 60 * v * v, p.s, p.s);
        }
        cx.globalAlpha = 1;
      };
      tl.to({ p: 0 }, { p: 1, duration: 60, ease: "none", onUpdate: () => paint(tl.time()) }, 0);
      tl.fromTo("#s4-who", { clipPath: "inset(0px 0px 0px 0px)" }, { clipPath: "inset(0px 0px 0px 840px)", duration: 1.7, ease: "none", immediateRender: false }, 2.75);

      // words, grey to ink
      const words = gsap.utils.toArray("#s4-text span");
      const at = [3.0, 3.12, 3.24, 3.8, 3.92, 4.3];
      words.forEach((w, i) => tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out" }, at[i]));
      tl.to("#s4-text", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, 5.8);
      window.__timelines["s4"] = tl;
