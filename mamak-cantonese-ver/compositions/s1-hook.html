            <path data-hf-id="hf-t341" d="M420 262q50-36 96-6M564 256q46-30 96 6" fill="none" stroke="#1d1a18" stroke-width="14" stroke-linecap="round" />
            <circle data-hf-id="hf-xx5x" cx="466" cy="336" r="46" fill="#fff" /><circle data-hf-id="hf-tjak" cx="614" cy="336" r="46" fill="#fff" />
            <circle data-hf-id="hf-r6d4" cx="466" cy="340" r="13" fill="#1d1a18" /><circle data-hf-id="hf-1aj7" cx="614" cy="340" r="13" fill="#1d1a18" />
            <ellipse data-hf-id="hf-sua9" cx="540" cy="470" rx="44" ry="60" fill="#3a1414" /><ellipse data-hf-id="hf-o2yo" cx="540" cy="500" rx="26" ry="20" fill="#c9562f" />
            <ellipse data-hf-id="hf-fm9v" cx="350" cy="440" rx="56" ry="92" fill="#b47d58" transform="rotate(14 350 440)" /><ellipse data-hf-id="hf-49qa" cx="730" cy="440" rx="56" ry="92" fill="#b47d58" transform="rotate(-14 730 440)" />
          </g>
          <path data-hf-id="hf-oq2l" id="s1-sweat" d="M712 230q18 30 0 44q-18-14 0-44z" fill="#9fd3f0" />
        </g>
      </svg>
      <canvas data-hf-id="hf-2uqp" id="s1-pcanvas" width="1080" height="1920"></canvas>
      <div data-hf-id="hf-z25p" id="s1-ask" class="s1-line"><span data-hf-id="hf-3bx6">想像吓…</span></div>
      <div data-hf-id="hf-jp70" id="s1-title" class="s1-line"><span data-hf-id="hf-89zv" id="s1-w1">全部</span><span data-hf-id="hf-t4ie" id="s1-w2">嘛嘛檔</span><span data-hf-id="hf-8obs" id="s1-w3" class="hl">消失咗。</span></div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // re-timed to the narration: old scene times map onto the voice
      const MAPK = [[0,0],[0.8,2.813],[1.05,3.032],[2.45,5.557],[4.32,7.41],[4.6,7.69]];
      const T = (t) => { for (let i = 1; i < MAPK.length; i++) { const [a0, b0] = MAPK[i - 1], [a1, b1] = MAPK[i]; if (t <= a1) return b0 + ((t - a0) * (b1 - b0)) / (a1 - a0); } const [a, b] = MAPK[MAPK.length - 1]; return b + (t - a); };
      ["to", "fromTo", "set"].forEach((m) => { const f = tl[m].bind(tl); tl[m] = (...a) => { const i = a.length - 1; if (typeof a[i] === "number") a[i] = T(a[i]); return f(...a); }; });
      const ease = "power2.in";

      // ceiling fans keep turning until they dissolve
      tl.fromTo("#s1-fan1", { rotation: 0 }, { rotation: 1600, svgOrigin: "0 0", duration: 3.7, ease: "none" }, 0);
      tl.fromTo("#s1-fan2", { rotation: 0 }, { rotation: 1600, svgOrigin: "0 0", duration: 3.7, ease: "none" }, 0);

      // seeded dust: small squares born where pieces were, drifting up
      let seed = 0x5eed1;
      const rnd = () => ((seed = (Math.imul(1664525, seed) + 1013904223) >>> 0) / 4294967296);
      const dust = document.getElementById("s1-dust");
      const bands = [[170, 540, 1.95], [552, 760, 1.2], [770, 1010, 1.65], [990, 1200, 1.5], [1180, 1440, 1.85], [600, 1560, 2.15], [120, 1560, 2.4]];
      const cols = ["#f2c230", "#d93a2b", "#2e6fd8", "#fff6e5", "#b9c3c2", "#c98b4f", "#7a2a22"];
      bands.forEach(([y0, y1, t]) => {
        for (let i = 0; i < 24; i++) {
          const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          const s = 6 + rnd() * 12;
          r.setAttribute("x", 60 + rnd() * 960); r.setAttribute("y", y0 + rnd() * (y1 - y0));
          r.setAttribute("width", s); r.setAttribute("height", s);
          r.setAttribute("fill", cols[Math.floor(rnd() * cols.length)]);
          r.setAttribute("opacity", 0);
          dust.appendChild(r);
          const d = t + rnd() * 0.25;
          tl.fromTo(r, { opacity: 0, x: 0, y: 0 }, { opacity: 0.9, duration: 0.08 }, d);
          tl.to(r, { x: (rnd() - 0.5) * 160, y: -120 - rnd() * 260, opacity: 0, rotation: rnd() * 180, transformOrigin: "50% 50%", duration: 0.7 + rnd() * 0.4, ease: "power2.out" }, d + 0.08);
        }
      });

      // MAMAK lettering bursts into particles, left to right (table-driven, repainted from time)
      const cv = document.getElementById("s1-pcanvas");
      const cx = cv.getContext("2d");
      const off = document.createElement("canvas");
      off.width = 1080; off.height = 600;
      const ox = off.getContext("2d", { willReadFrequently: true });
      ox.font = "150px 'Archivo Black', 'Arial Black', sans-serif";
      ox.textAlign = "center"; ox.textBaseline = "alphabetic";
      ox.fillStyle = "#fff"; ox.fillText("MAMAK", 480, 398);
      const px = ox.getImageData(0, 0, 1080, 600).data;
      const parts = [];
      for (let y = 260; y < 420; y += 5) for (let x = 60; x < 900; x += 5) {
        if (px[(y * 1080 + x) * 4 + 3] > 127) {
          const a = rnd() * Math.PI * 2;
          parts.push({ x, y, at: T(1.05 + ((x - 140) / 680) * 0.7 + rnd() * 0.08), dur: 0.6 + rnd() * 0.5, d: 80 + rnd() * 320, ax: Math.cos(a), ay: Math.sin(a) - 0.8, r: 2 + rnd() * 3.5 });
        }
      }
      const paint = (t) => {
        cx.clearRect(0, 0, 1080, 1920);
        cx.fillStyle = "#d93a2b";
        for (const p of parts) {
          const v = (t - p.at) / p.dur;
          if (v <= 0 || v >= 1) continue;
          const e = 1 - Math.pow(1 - v, 2);
          cx.globalAlpha = 1 - v;
          cx.fillRect(p.x + p.ax * p.d * e, p.y + p.ay * p.d * e, p.r, p.r);
        }
        cx.globalAlpha = 1;
      };
      tl.to({ p: 0 }, { p: 1, duration: 60, ease: "none", onUpdate: () => paint(tl.time()) }, 0);
      tl.fromTo("#s1-mamak", { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 100%)", duration: 1.2, ease: "power1.inOut" }, 1.05);

      // hook line, then out
      tl.fromTo("#s1-ask", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.22, ease }, 1.0);
      // lights flicker, then everything dissolves top-down
      tl.to("#s1-tube1", { keyframes: [{ opacity: 0.3, duration: 0.05 }, { opacity: 1, duration: 0.05 }, { opacity: 0.2, duration: 0.05 }, { opacity: 1, duration: 0.06 }] }, 0.8);
      tl.to("#s1-tube2", { keyframes: [{ opacity: 0.2, duration: 0.05 }, { opacity: 1, duration: 0.06 }, { opacity: 0.4, duration: 0.05 }, { opacity: 1, duration: 0.05 }] }, 0.84);
      const out = (sel, t) => tl.fromTo(sel, { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -70, filter: "blur(14px)", duration: 0.5, ease }, t);
      out("#s1-tube1", 1.15);
      out("#s1-tube2", 1.15);
      out("#s1-fans", 1.2);
      out("#s1-awning", 1.3);
      out("#s1-people", 1.4);
      out("#s1-cups", 1.5);
      out("#s1-wall", 1.65);
      out("#s1-tables", 1.8);
      out("#s1-sign", 1.95);
      out("#s1-diners", 1.45);
      out("#s1-stools", 2.0);
      out("#s1-interior", 2.15);
      out("#s1-facade", 2.4);
      tl.fromTo("#s1-outline", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.5);
      tl.fromTo("#s1-lone", { opacity: 0 }, { opacity: 1, duration: 0.08 }, 2.45);
      tl.fromTo("#s1-face", { y: 60 }, { y: 0, duration: 0.35, ease: "back.out(1.8)" }, 2.45);
      tl.to("#s1-face", { keyframes: [{ x: -10, duration: 0.05 }, { x: 10, duration: 0.05 }, { x: -8, duration: 0.05 }, { x: 8, duration: 0.05 }, { x: 0, duration: 0.05 }] }, 2.85);
      tl.fromTo("#s1-sweat", { y: 0, opacity: 1 }, { y: 120, opacity: 0, duration: 0.9, ease: "power2.in" }, 3.0);

      // title per word
      ["#s1-w1", "#s1-w2", "#s1-w3"].forEach((w, i) => {
        tl.fromTo(w, { opacity: 0, filter: "blur(10px)", scale: 1.08 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.16, ease: "power4.out" }, 2.65 + i * 0.16);
      });

      // whip up into the phone
      tl.to("#s1-stage", { y: -420, filter: "blur(18px)", opacity: 0.2, duration: 0.28, ease: "power3.in" }, 4.32);
      window.__timelines["s1"] = tl;
    })();
  </script>
</template>
